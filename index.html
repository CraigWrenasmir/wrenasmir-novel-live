<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Their Most August Public Organ | Writing Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="screen-noise" aria-hidden="true"></div>
  <header class="hero">
    <p class="eyebrow">WRITING SIGNAL</p>
    <h1>Their Most August Public Organ</h1>
    <p class="subtitle">
      A live writing log: real-time drafts, scene progression, visual documents, and bi-weekly audio blogs.
    </p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="top-level-title">
      <h2 id="top-level-title">Repository Areas</h2>
      <div class="chip-row" id="top-level-links"></div>
    </section>

    <section class="panel" aria-labelledby="draft-map-title">
      <h2 id="draft-map-title">Draft Scene Map</h2>
      <div id="draft-map"></div>
    </section>

    <section class="panel" aria-labelledby="audio-title">
      <h2 id="audio-title">Audio Blog</h2>
      <div id="audio-list" class="audio-list"></div>
    </section>

    <section class="panel" aria-labelledby="visuals-title">
      <h2 id="visuals-title">Visuals</h2>
      <p class="note">Visual documents and concept maps.</p>
      <div id="visual-gallery" class="visual-gallery"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Manual updates only. Publish cadence: your pace.</p>
  </footer>

  <script src="/assets/app.js" defer></script>
</body>
</html>
