<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Their Most August Public Organ | Craig Warren Smith</title>
  <meta name="description" content="Their Most August Public Organ, a novel by Craig Warren Smith. Read it, hear it read, or play ROOT, from a surviving ROOT node.">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/terminal.css">
  <style>
    /* ---------- The /ROOT directory ---------- */
    .display .dir-title { margin: 0 0 0.15em; letter-spacing: 0.08em; }
    .display .dir-by { margin: 0 0 1.4em; color: var(--phos-dim); text-shadow: none; letter-spacing: 0.2em; font-size: 0.72em; }
    .dir { margin: 0; padding: 0; list-style: none; white-space: pre; }
    .dir .path { color: var(--phos-dim); text-shadow: none; }
    .dir .row {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
      column-gap: 1.5em;
      width: 100%;
      padding: 0.3em 0.2em;
      margin: 0;
      background: none; border: 0; border-radius: 2px;
      color: inherit; font: inherit; text-align: left; text-decoration: none; text-shadow: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .dir .row .name { white-space: pre; }
    .dir .row .what { margin-left: auto; color: var(--phos-dim); text-shadow: none; }
    .dir .row .num { color: var(--phos-dim); text-shadow: none; }
    .dir .row .cur { display: inline-block; width: 1.2em; visibility: hidden; }
    .dir .row.on { background: rgba(255, 176, 0, 0.09); }
    .dir .row.on .name { text-decoration: underline; text-underline-offset: 0.25em; }
    .dir .row.on .what { color: var(--phos); }
    .dir .row.on .cur { visibility: visible; animation: blink 1.05s steps(1) infinite; }
    .dir .row:focus-visible { outline: 1px solid var(--phos); outline-offset: 1px; }
    .dir .row.off { cursor: default; color: var(--phos-dim); text-shadow: none; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .dir .row.on .cur { animation: none; } }
    body.steady .dir .row.on .cur { animation: none; }
    .display .dir-hint { margin-top: 1.5em; }

    /* ---------- README.txt, read in the tube ---------- */
    .readme { max-width: 62ch; }
    .readme p { margin: 0 0 1em; }
    .readme em { font-style: italic; }
    .readme figure { margin: 0 0 1.8em; }
    .readme .links { margin-top: 2em; }
    .readme .links p { margin: 0 0 0.45em; }
    .readme a { color: var(--phos); text-underline-offset: 0.25em; }
    .readme a:focus-visible { outline: 1px solid var(--phos); outline-offset: 2px; }
    .readme .frames { margin-top: 2.2em; }
    .readme .frame {
      position: relative; display: block; width: 100%; aspect-ratio: 4 / 3;
      padding: 0; background: #000; border: 1px solid var(--phos-dim); border-radius: 3px;
      overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .readme .frame:focus-visible { outline: 1px solid var(--phos); outline-offset: 2px; }
    .readme .frame img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity 1.1s ease;
    }
    .readme .frame img.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .readme .frame img { transition: none; } }
    body.steady .readme .frame img { transition: none; }
    .readme figcaption { margin-top: 0.6em; letter-spacing: 0.2em; font-size: 0.72em; }

    /* fascia: directory keys, or program keys while something is loaded in the tube */
    .keys-run { display: none; }
    body.running .keys-dir, body.doc .keys-dir { display: none; }
    body.running .keys-run, body.doc .keys-run { display: flex; }
    body.doc .keys-run [data-cmd="FULL"] { display: none; }
  </style>
</head>
<body>
  <div class="field-bg" aria-hidden="true"></div>
  <div class="field-veil" aria-hidden="true"></div>
  <main class="crt" aria-label="ROOT terminal">
    <div class="screen-well">
      <div class="screen flicker" id="screen">
        <div class="refresh-band" aria-hidden="true"></div>
        <div class="display" id="display">
          <noscript>
            <p>THEIR MOST AUGUST PUBLIC ORGAN</p>
            <p><a href="/read/" style="color:inherit">Read the novel</a> · <a href="https://root.wrenasmir.com" style="color:inherit">Play ROOT</a></p>
          </noscript>
        </div>
        <div class="cmdline" id="cmdline">
          <span class="prompt-char" aria-hidden="true">&gt;</span>
          <input id="cmd" type="text" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" aria-label="Terminal command input" placeholder="">
        </div>
      </div>
    </div>
    <div class="fascia">
      <span class="power-led" aria-hidden="true"></span>
      <span class="badge">ROOT · solar ok · canopy link intermittent</span>
      <div class="keys keys-dir">
        <button class="key" data-cmd="UP" aria-label="Previous entry">▲</button>
        <button class="key" data-cmd="DOWN" aria-label="Next entry">▼</button>
        <button class="key" data-cmd="OPEN" aria-label="Open the selected entry">OPEN</button>
        <button class="key" data-cmd="HELP" aria-label="Help">?</button>
      </div>
      <div class="keys keys-run">
        <button class="key" data-cmd="FULL" aria-label="Open in a new tab">FULL</button>
        <button class="key" data-cmd="EJECT" aria-label="Back to the directory">EJECT</button>
      </div>
    </div>
  </main>

  <!-- README.txt: everything on the about screen. Edit the words here. -->
  <template id="readme">
    <p>I have looked out the window for untold hours while travelling on trains. The opening line of the novel, <em>At meaning's edge the imagination still flickers</em>, came to me, like most things, on a walk one evening with my dog. It felt like it represented something of the state of play in our age regarding the role of the mind - when cognition is being increasingly outsourced, when a cavalcade of media is being positioned in front of our eyes at every possible instance, what does/can the mind do when it is left by itself, to daydream whilst looking out the window? For me, the imagination still flickers: in the face of everything, it still maintains light.</p>
    <p>Listening to an interview with Adam Curtis earlier this year, he said something about how serious contemporary stories should be ghost stories about AI. This felt right to me, and that to ignore the technological machinations of today, to say nothing of wars of nationalism and genocide, would be a moral failing. I understand that this book may not seem like it directly deals with any of those things, but perhaps, without giving too much away, I would say that for me, the critical gesture was to unpack the epistemological impact of G&ouml;del's incompleteness theorems: how much are we ever a solo author of our work and ourselves, within a closed system, and how much are we always being authored and authoring the world around us in a recursive loop of subjectivity? How much of that interfaces between the natural and the synthetic? And how does all this relate to a man in his forties, still trying to get his imagination to flicker whilst taking the train to see his friend?</p>
    <p>As always, I am indebted to my forefathers, Les Murray and Gerald Murnane, and hope that this work sits in dialogue with the preceding book, <em>Everyone I Love Is Alive In The Unlimited Present of the City and its Waters</em>, and the book I am working on to complete the trilogy, <em>Surplus of the Seen</em>.</p>
    <p>Thank you.</p>
    <p>Craig, 04/10/26.</p>

    <!-- The photographs: /about/photos/01.jpg to NN.jpg, shown in a fresh random order on each visit. -->
    <figure class="frames">
      <button type="button" class="frame" aria-label="Next photograph">
        <img class="a" alt="" decoding="async"><img class="b" alt="" decoding="async">
      </button>
      <figcaption class="sys"><span class="count"></span> · TAP FOR THE NEXT</figcaption>
    </figure>

    <div class="links">
      <p><a href="/read/">&gt; Read the novel</a></p>
      <p><a href="/" data-home>&gt; Back to /ROOT</a></p>
    </div>
  </template>

  <script>
    /* The unabridged recording. Paste the YouTube video ID here once it is uploaded
       (the part after watch?v=). While this is empty the recording is listed under
       /unverified/ as a .tmp file and cannot be selected. */
    const VIDEO_ID = "";

    const ROOT_URL = "https://root.wrenasmir.com";

    if (new URLSearchParams(location.search).has("embed")) {
      document.body.classList.add("embed");
    }

    const BOOT_LINES = [
      "ROOT NODE 07 — POWER: SOLAR (trickle) .......... OK",
      "MOUNT /ROOT .................................... OK",
      "CANOPY LINK .................................... INTERMITTENT",
      "CHECKSUM /text ................................. UNCHANGED*",
      "ARCHIVE: THEIR MOST AUGUST PUBLIC ORGAN",
      "PAGES RECOVERED: 82",
      "",
      "STATUS: BEING READ",
      ""
    ];

    const FILE = "Their_Most_August_Public_Organ";
    const ENTRIES = [
      { id: "about", path: null,     name: "README.txt",    what: "about the novel" },
      { id: "read",  path: "/text",  name: FILE + ".txt",   what: "read the novel",       href: "/read/" },
      VIDEO_ID
        ? { id: "watch", path: "/audio",      name: FILE + ".mp4",     what: "unabridged recording" }
        : { id: "watch", path: "/unverified", name: FILE + ".mp4.tmp", what: "recording in progress", off: true },
      { id: "play",  path: "/game", name: "ROOT",          what: "play" }
    ];

    /* shares the reader's settings (STEADY, FIELD) without touching its page or mode */
    const readState = () => { try { return JSON.parse(localStorage.getItem("tmapo-terminal") || "{}"); } catch (e) { return {}; } };
    const state = readState();
    if (state.steady) document.body.classList.add("steady");
    if (state.field !== false && !document.body.classList.contains("embed")) {
      document.body.classList.add("field");
    }
    const save = () => {
      try {
        localStorage.setItem("tmapo-terminal", JSON.stringify(Object.assign(readState(), {
          steady: document.body.classList.contains("steady"),
          field: document.body.classList.contains("field")
        })));
      } catch (e) {}
    };

    const display = document.getElementById("display");
    const cmd = document.getElementById("cmd");
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    let current = 0;       // index into ENTRIES
    let running = null;    // URL to open with FULL while a program is in the tube
    let menuShown = false;
    let doc = false;       // README.txt is open in the tube

    const PHOTO_COUNT = 42;                      // /about/photos/01.jpg ... 42.jpg
    const PHOTO_SECONDS = 7;
    const photoSrc = n => "/about/photos/" + String(n).padStart(2, "0") + ".jpg";
    let frameTimer = null;

    /* the photographs under the README: shuffled afresh on each visit, crossfading in one frame */
    function startFrames() {
      clearInterval(frameTimer);
      const frame = display.querySelector(".frame");
      if (!frame) return;
      const order = Array.from({ length: PHOTO_COUNT }, (_, i) => i + 1);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      const imgs = frame.querySelectorAll("img"), count = display.querySelector(".frames .count");
      let k = -1, top = 1;
      const step = () => {
        k = (k + 1) % order.length;
        top = 1 - top;
        const img = imgs[top], other = imgs[1 - top];
        img.onload = () => { img.classList.add("show"); other.classList.remove("show"); };
        img.src = photoSrc(order[k]);
        count.textContent = "FRAME " + String(k + 1).padStart(2, "0") + " / " + order.length;
        new Image().src = photoSrc(order[(k + 1) % order.length]);   // have the next one ready
      };
      const auto = () => {
        clearInterval(frameTimer);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;   // then it only moves on a tap
        frameTimer = setInterval(() => {
          if (!frame.isConnected) { clearInterval(frameTimer); return; }
          if (!document.hidden && !document.body.classList.contains("steady")) step();
        }, PHOTO_SECONDS * 1000);
      };
      frame.addEventListener("click", () => { step(); auto(); });
      step(); auto();
    }

    const setHash = h => { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {} };

    function showMenu() {
      running = null;
      menuShown = true;
      if (doc) setHash("");
      doc = false;
      document.body.classList.remove("running", "doc");
      let html = '<p class="dir-title">THEIR MOST AUGUST PUBLIC ORGAN</p>' +
                 '<p class="dir-by">CRAIG WARREN SMITH</p>' +
                 '<ul class="dir" role="list"><li class="path">/ROOT</li>';
      ENTRIES.forEach((e, i) => {
        if (e.path) html += '<li class="path">  ' + esc(e.path) + '</li>';
        const indent = e.path ? "  " : "";
        const inner = '<span class="name"><span class="cur" aria-hidden="true">▮</span>' + indent + esc(e.name) + '</span>' +
                      '<span class="what">' + esc(e.what) + ' <span class="num" aria-hidden="true">[' + (i + 1) + ']</span></span>';
        const cls = 'row' + (e.off ? ' off' : '');
        html += '<li>' + (e.off
          ? '<div class="' + cls + '" data-i="' + i + '" aria-disabled="true">' + inner + '</div>'
          : e.href
            ? '<a class="' + cls + '" data-i="' + i + '" href="' + e.href + '">' + inner + '</a>'
            : '<button type="button" class="' + cls + '" data-i="' + i + '">' + inner + '</button>') + '</li>';
      });
      html += '</ul><p class="sys dir-hint">↑ ↓ TO MOVE · ENTER TO OPEN · OR TAP A LINE</p>';
      display.innerHTML = html;
      display.scrollTop = 0;
      mark();
    }

    function mark() {
      display.querySelectorAll(".row").forEach(r =>
        r.classList.toggle("on", +r.dataset.i === current));
    }

    function move(d) {
      if (doc) { display.scrollBy({ top: d * display.clientHeight * 0.6 }); return; }
      if (!menuShown || running) { showMenu(); return; }
      let i = current;
      do { i = (i + d + ENTRIES.length) % ENTRIES.length; } while (ENTRIES[i].off);
      current = i;
      mark();
    }

    function say(line, cls) {
      if (running || doc || !menuShown) showMenu();
      display.querySelectorAll(".said").forEach(n => n.remove());
      display.insertAdjacentHTML("beforeend", '<p class="said ' + (cls || "sys") + '">' + esc(line) + '</p>');
      display.scrollTop = display.scrollHeight;
    }

    /* README.txt: about the novel. The words are in the README template below the script's markup. */
    function showReadme() {
      running = null; menuShown = false; doc = true;
      document.body.classList.remove("running");
      document.body.classList.add("doc");
      display.innerHTML = '<div class="page-head">/ROOT/README.txt · TYPE EJECT TO RETURN</div>' +
                          '<article class="readme">' + document.getElementById("readme").innerHTML + '</article>';
      display.scrollTop = 0;
      setHash("about");
      startFrames();
    }

    function tube(head, src, title, full) {
      if (doc) setHash("");
      running = full; doc = false;
      document.body.classList.remove("doc");
      document.body.classList.add("running");
      display.innerHTML =
        '<div class="page-head">' + esc(head) + ' · TYPE EJECT TO RETURN</div>' +
        '<div class="game-wrap"><iframe src="' + src + '" title="' + esc(title) + '" ' +
        'allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>';
      display.scrollTop = 0;
    }

    function openEntry(id) {
      const i = ENTRIES.findIndex(e => e.id === id);
      const e = ENTRIES[i];
      if (e.off) { say("/unverified/" + e.name + " · RECORDING IN PROGRESS. NOT YET READABLE."); return; }
      current = i;
      if (e.href) { location.href = e.href; return; }
      if (id === "about") { showReadme(); return; }
      if (id === "watch") {
        tube("/audio/" + e.name, "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(VIDEO_ID) + "?rel=0",
             "Their Most August Public Organ, the unabridged recording",
             "https://www.youtube.com/watch?v=" + encodeURIComponent(VIDEO_ID));
      } else if (id === "play") {
        tube("EXTERNAL PROGRAM: /game/ROOT", ROOT_URL, "ROOT, the game", ROOT_URL);
      }
    }

    function help() {
      running = null; menuShown = false;
      if (doc) setHash("");
      doc = false;
      document.body.classList.remove("running", "doc");
      display.innerHTML = [
        "COMMANDS",
        "  READ ............... open the novel in this terminal",
        "  ABOUT .............. README.txt: about the novel and its author",
        "  WATCH .............. the unabridged recording" + (VIDEO_ID ? "" : " (in progress)"),
        "  PLAY ............... load ROOT, the resident program",
        "  FULL ............... open the loaded program in its own tab",
        "  EJECT .............. back to the directory",
        "  STEADY ............. calm the tube (scanlines/flicker off)",
        "  FIELD .............. take the node in / out of the paddock",
        "  HELP ............... this",
        "",
        "Or use the arrow keys and ENTER, the numbers 1 to 4, or tap a line.",
        "",
        "PRESS ENTER TO RETURN TO /ROOT."
      ].map(l => '<p class="sys" style="white-space:pre-wrap">' + esc(l || " ") + "</p>").join("");
      display.scrollTop = 0;
    }

    function run(raw) {
      const c = raw.trim().toUpperCase();
      if (!c) return;
      if (c === "UP") return move(-1);
      if (c === "DOWN") return move(1);
      if (c === "OPEN") return (!menuShown || running || doc) ? showMenu() : openEntry(ENTRIES[current].id);
      if (/^[1-4]$/.test(c)) return openEntry(ENTRIES[+c - 1].id);
      if (c === "READ" || c === "TEXT" || c === "BOOK") return openEntry("read");
      if (c === "ABOUT" || c === "README" || c === "README.TXT") return openEntry("about");
      if (c === "WATCH" || c === "LISTEN" || c === "AUDIO") return openEntry("watch");
      if (c === "PLAY" || c === "ROOT" || c === "RUN ROOT") return openEntry("play");
      if (c === "FULL") { if (running) window.open(running, "_blank", "noopener"); else say("NOTHING LOADED. TRY PLAY."); return; }
      if (c === "EJECT" || c === "HOME" || c === "LS" || c === "MENU" || c === "INDEX" || c === "BACK") return showMenu();
      if (c === "HELP" || c === "?") return help();
      if (c === "STEADY") { document.body.classList.toggle("steady"); save(); return; }
      if (c === "FIELD") { document.body.classList.toggle("field"); save(); return; }
      say("UNRECOGNISED: " + c + " · TRY HELP", "err");
    }

    /* boot sequence, once per visit */
    function boot() {
      let seen = false;
      try { seen = sessionStorage.getItem("tmapo-booted") === "1"; sessionStorage.setItem("tmapo-booted", "1"); } catch (e) {}
      if (location.hash === "#about") { showReadme(); return; }
      if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) { showMenu(); return; }
      let i = 0;
      display.innerHTML = "";
      const tick = () => {
        if (menuShown) return;   // a key or tap skipped the boot
        if (i < BOOT_LINES.length) {
          display.insertAdjacentHTML("beforeend", '<p class="sys">' + esc(BOOT_LINES[i] || " ") + "</p>");
          i++;
          setTimeout(tick, BOOT_LINES[i - 1] === "" ? 120 : 240);
        } else {
          setTimeout(() => { if (!menuShown) showMenu(); }, 500);
        }
      };
      tick();
    }

    /* wiring */
    cmd.addEventListener("keydown", e => {
      if (e.key === "Enter" && cmd.value) { run(cmd.value); cmd.value = ""; e.stopPropagation(); }
    });
    document.getElementById("cmdline").addEventListener("click", () => cmd.focus());
    document.querySelectorAll(".key").forEach(k =>
      k.addEventListener("click", () => run(k.dataset.cmd)));

    display.addEventListener("click", e => {
      if (e.target.closest("[data-home]")) { e.preventDefault(); showMenu(); return; }
      const row = e.target.closest(".row");
      if (!row) { if (!menuShown && !running && !doc) showMenu(); return; }
      e.preventDefault();
      openEntry(ENTRIES[+row.dataset.i].id);
    });
    display.addEventListener("mouseover", e => {
      const row = e.target.closest(".row");
      if (row && !row.classList.contains("off")) { current = +row.dataset.i; mark(); }
    });
    display.addEventListener("focusin", e => {
      const row = e.target.closest(".row");
      if (row) { current = +row.dataset.i; mark(); }
    });

    document.addEventListener("keydown", e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Escape") { cmd.value = ""; showMenu(); return; }
      if (cmd.value) return;                       // a command is being typed
      if (e.key === "ArrowDown") { e.preventDefault(); run("DOWN"); }
      else if (e.key === "ArrowUp") { e.preventDefault(); run("UP"); }
      else if (e.key === "Enter") {
        if (e.target.closest && e.target.closest("button.key, .readme button, .readme a")) return;   // the key or link handles it itself
        e.preventDefault(); run("OPEN");
      }
      else if (/^[1-4]$/.test(e.key) && menuShown && !running) { e.preventDefault(); run(e.key); }
      else if (e.key.length === 1 && /[a-z?]/i.test(e.key) && document.activeElement !== cmd) cmd.focus();
    });

    /* coming back with the browser's Back button: land on the directory, not a stale tube */
    addEventListener("pageshow", e => { if (e.persisted) showMenu(); });

    boot();
  </script>
</body>
</html>
