<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOT Terminal | Their Most August Public Organ</title>
  <meta name="description" content="Read Their Most August Public Organ through a surviving ROOT node session.">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --phos: #ffb000;
      --phos-dim: #8a5f00;
      --phos-glow: rgba(255, 176, 0, 0.55);
      --tube: #050300;
      --case: #1a1611;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* ?embed=1 — just the monitor, for iframing into Squarespace */
    body.embed {
      background: transparent;
      padding: 0;
      min-height: 100%;
    }
    html:has(body.embed) { background: transparent; }

    /* ---------- The paddock (FIELD mode) ---------- */
    .field-bg, .field-veil { position: fixed; inset: 0; display: none; pointer-events: none; }
    body.field .field-bg, body.field .field-veil { display: block; }
    .field-bg {
      background: url("field.jpg") center 42% / cover no-repeat;
      filter: brightness(0.88) saturate(1.04);
      z-index: -2;
    }
    .field-veil {
      background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(5, 3, 0, 0.5) 100%);
      z-index: -1;
    }
    body.field .crt {
      box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.08),
        inset 0 -6px 14px rgba(0,0,0,0.6),
        0 30px 70px rgba(0,0,0,0.85);
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 30%, #24201a 0%, #0c0a07 70%);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2vmin;
    }

    /* ---------- The monitor ---------- */
    .crt {
      width: min(760px, calc(100vw - 12px));
      background: linear-gradient(160deg, #2b251d 0%, var(--case) 40%, #0f0d0a 100%);
      border-radius: 26px;
      padding: clamp(10px, 3vmin, 30px);
      box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.08),
        inset 0 -6px 14px rgba(0,0,0,0.6),
        0 18px 50px rgba(0,0,0,0.7);
    }
    .screen-well {
      background: #000;
      border-radius: 18px;
      padding: 10px;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.95);
    }
    .screen {
      position: relative;
      background: var(--tube);
      border-radius: 14px;
      overflow: hidden;
      height: min(72vh, 560px);
      color: var(--phos);
      text-shadow: 0 0 5px var(--phos-glow);
      font-size: clamp(11px, 2.5vw, 14.5px);
      line-height: 1.5;
    }
    /* curvature vignette */
    .screen::before {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
      z-index: 6;
    }
    /* scanlines */
    .screen::after {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.28) 0px, rgba(0,0,0,0.28) 1px,
        transparent 2px, transparent 4px
      );
      z-index: 5;
    }
    .refresh-band {
      position: absolute; left: 0; right: 0;
      height: 90px;
      background: linear-gradient(to bottom, transparent, rgba(255,200,80,0.05), transparent);
      z-index: 4; pointer-events: none;
      animation: sweep 7s linear infinite;
    }
    @keyframes sweep { from { top: -120px; } to { top: 110%; } }
    .screen.flicker { animation: flick 4.3s infinite; }
    @keyframes flick {
      0%, 100% { opacity: 1; } 97.5% { opacity: 1; }
      98% { opacity: 0.93; } 98.5% { opacity: 1; } 99.2% { opacity: 0.96; }
    }
    @media (prefers-reduced-motion: reduce) {
      .screen.flicker { animation: none; }
      .refresh-band { animation: none; display: none; }
    }
    body.steady .screen.flicker { animation: none; }
    body.steady .refresh-band { display: none; }
    body.steady .screen::after { opacity: 0.4; }

    /* ---------- Screen content ---------- */
    .display {
      position: absolute; inset: 0;
      overflow-y: auto;
      padding: 1.1rem 1.2rem 3.2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--phos-dim) transparent;
      z-index: 2;
    }
    .display p { margin: 0 0 0.9em; }
    .display pre {
      margin: 0.9em 0;
      font-family: inherit;
      font-size: clamp(7.5px, 2.1vw, 13px);
      line-height: 1.35;
      overflow-x: auto;
      text-shadow: 0 0 4px var(--phos-glow);
    }
    .display .sys { color: var(--phos-dim); text-shadow: none; }
    .display .page-head {
      color: var(--phos-dim);
      letter-spacing: 0.2em;
      font-size: 0.72em;
      margin-bottom: 1.2em;
      text-shadow: none;
    }
    .display .err { color: #ff6a4d; text-shadow: 0 0 5px rgba(255,106,77,0.5); }

    /* scan mode */
    /* crop the typeset page's blank margins (measured: L/R ~14%, T ~20%, B ~5%) */
    .scan-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 789 / 1303;
      border-radius: 3px;
    }
    .scan-wrap img {
      position: absolute;
      width: 129.9%;
      left: -14.9%;
      top: -22.2%;
      filter: invert(0.94) sepia(0.9) saturate(2.6) hue-rotate(-12deg) brightness(1.18) contrast(1.12);
    }
    body.paper .scan-wrap img { filter: none; background: #fff; }

    /* command line */
    .cmdline {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.55rem 1.2rem;
      background: linear-gradient(to top, rgba(5,3,0,0.96) 60%, transparent);
      z-index: 7;
      cursor: text;
    }
    .cmdline .prompt-char { color: var(--phos); }
    .cmdline input {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--phos);
      font: inherit;
      text-shadow: 0 0 5px var(--phos-glow);
      caret-color: var(--phos);
      text-transform: uppercase;
    }

    /* ---------- Controls under the glass ---------- */
    .fascia {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.9rem 0.4rem 0.1rem;
    }
    .badge {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: #6b5f4c;
      text-transform: uppercase;
      user-select: none;
    }
    .keys { display: flex; gap: 0.45rem; }
    .key {
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: #cdbfa4;
      background: linear-gradient(180deg, #383126 0%, #211c15 100%);
      border: 1px solid #0c0a07;
      border-radius: 6px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      box-shadow: 0 2px 0 #0c0a07, inset 0 1px 0 rgba(255,255,255,0.09);
    }
    .key:active { transform: translateY(1px); box-shadow: 0 1px 0 #0c0a07; }
    .key:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }
    .power-led {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--phos);
      box-shadow: 0 0 8px var(--phos-glow);
    }
    @media (max-width: 520px) {
      body { padding: 1vmin; }
      .crt { border-radius: 16px; }
      .screen { height: 74vh; }
      .key { padding: 0.4rem 0.6rem; font-size: 0.66rem; }
      .badge { display: none; }
    }
  </style>
</head>
<body>
  <div class="field-bg" aria-hidden="true"></div>
  <div class="field-veil" aria-hidden="true"></div>
  <main class="crt" aria-label="ROOT terminal reader">
    <div class="screen-well">
      <div class="screen flicker" id="screen">
        <div class="refresh-band" aria-hidden="true"></div>
        <div class="display" id="display" aria-live="polite"></div>
        <div class="cmdline" id="cmdline">
          <span class="prompt-char" aria-hidden="true">&gt;</span>
          <input id="cmd" type="text" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" aria-label="Terminal command input" placeholder="">
        </div>
      </div>
    </div>
    <div class="fascia">
      <span class="power-led" aria-hidden="true"></span>
      <span class="badge">ROOT · solar ok · canopy link intermittent</span>
      <div class="keys">
        <button class="key" data-cmd="BACK" aria-label="Previous page">◀</button>
        <button class="key" data-cmd="NEXT" aria-label="Next page">▶</button>
        <button class="key" data-cmd="MODE" aria-label="Toggle scan/text mode">MODE</button>
        <button class="key" data-cmd="HELP" aria-label="Help">?</button>
      </div>
    </div>
  </main>

  <script>
    if (new URLSearchParams(location.search).has("embed")) {
      document.body.classList.add("embed");
    }

    const TOTAL_SCANS = 39;
    const scanSrc = n => "../progress/pages/Page%20" + n + ".png";

    /* Text layer: built from TMAPO-Manuscript.md by build-text.py (pages 1-31 so far).
       The page PNGs remain authoritative for exact ASCII layout. */
    let TEXT_PAGES = {};
    fetch("pages.json")
      .then(r => r.ok ? r.json() : {})
      .then(d => { TEXT_PAGES = d; if (mode === "text") showPage(); })
      .catch(() => {});

    const BOOT_LINES = [
      "ROOT NODE 07 — POWER: SOLAR (trickle) .......... OK",
      "MOUNT /ROOT .................................... OK",
      "CANOPY LINK .................................... INTERMITTENT",
      "CHECKSUM /text ................................. UNCHANGED*",
      "ARCHIVE: THEIR MOST AUGUST PUBLIC ORGAN",
      "PAGES RECOVERED: 39",
      "",
      "STATUS: BEING READ",
      ""
    ];

    const state = JSON.parse(localStorage.getItem("tmapo-terminal") || "{}");
    let page = Math.min(Math.max(state.page || 1, 1), TOTAL_SCANS);
    let mode = state.mode === "text" ? "text" : "scan";
    if (state.steady) document.body.classList.add("steady");
    if (state.paper) document.body.classList.add("paper");
    if (state.field !== false && !document.body.classList.contains("embed")) {
      document.body.classList.add("field");
    }
    const save = () => localStorage.setItem("tmapo-terminal", JSON.stringify({
      page, mode,
      steady: document.body.classList.contains("steady"),
      paper: document.body.classList.contains("paper"),
      field: document.body.classList.contains("field")
    }));

    const display = document.getElementById("display");
    const cmd = document.getElementById("cmd");

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    }

    function showPage() {
      let html = '<div class="page-head">— PAGE ' + page + ' / ' + TOTAL_SCANS +
                 ' · MODE: ' + mode.toUpperCase() + ' —</div>';
      if (mode === "scan") {
        html += '<div class="scan-wrap"><img src="' + scanSrc(page) +
                '" alt="Typeset page ' + page + ' of the manuscript"></div>';
      } else {
        const t = TEXT_PAGES[page];
        if (!t) {
          html += '<p class="sys">TEXT LAYER NOT YET RECOVERED FOR PAGE ' + page +
                  ' — DISPLAYING SCAN.</p>' +
                  '<div class="scan-wrap"><img src="' + scanSrc(page) +
                  '" alt="Typeset page ' + page + ' of the manuscript"></div>';
        } else {
          t.forEach(part => {
            if (typeof part === "string") html += "<p>" + esc(part) + "</p>";
            else html += "<pre>" + esc(part.pre) + "</pre>";
          });
        }
      }
      display.innerHTML = html;
      display.scrollTop = 0;
      save();
    }

    function sysLines(lines) {
      display.innerHTML = lines.map(l => '<p class="sys">' + esc(l) + "</p>").join("");
      display.scrollTop = 0;
    }

    function help() {
      sysLines([
        "COMMANDS",
        "  NEXT / BACK ........ turn the page (also ◀ ▶, arrow keys, swipe)",
        "  GOTO n ............. jump to page n",
        "  INDEX .............. list recovered pages",
        "  MODE ............... toggle SCAN (microfiche) / TEXT (phosphor)",
        "  PAPER .............. scan mode: flip negative ↔ white paper",
        "  STEADY ............. calm the tube (scanlines/flicker off)",
        "  FIELD .............. take the node in / out of the paddock",
        "  HELP ............... this",
        "",
        "The scans are the authoritative typesetting. The text layer is",
        "recovered progressively; pages without text fall back to scan.",
        "",
        "PRESS ANY PAGE COMMAND TO RESUME."
      ]);
    }

    function index() {
      const rows = [];
      for (let i = 1; i <= TOTAL_SCANS; i += 10) {
        rows.push(Array.from({length: Math.min(10, TOTAL_SCANS - i + 1)},
          (_, k) => String(i + k).padStart(3, " ")).join(" "));
      }
      sysLines(["/ROOT/pages — " + TOTAL_SCANS + " recovered", ""].concat(rows)
        .concat(["", "GOTO n TO OPEN."]));
    }

    function run(raw) {
      const c = raw.trim().toUpperCase();
      if (!c) return;
      const goto = c.match(/^(?:GOTO|G)\s+(\d+)$/);
      if (c === "NEXT" || c === "N") { page = Math.min(page + 1, TOTAL_SCANS); showPage(); }
      else if (c === "BACK" || c === "B" || c === "PREV") { page = Math.max(page - 1, 1); showPage(); }
      else if (goto) {
        const n = parseInt(goto[1], 10);
        if (n >= 1 && n <= TOTAL_SCANS) { page = n; showPage(); }
        else display.insertAdjacentHTML("beforeend",
          '<p class="err">NO SUCH PAGE. RECOVERED RANGE: 1–' + TOTAL_SCANS + '</p>');
      }
      else if (c === "MODE" || c === "MODE TEXT" || c === "MODE SCAN") {
        mode = c === "MODE TEXT" ? "text" : c === "MODE SCAN" ? "scan"
             : (mode === "scan" ? "text" : "scan");
        showPage();
      }
      else if (c === "PAPER") { document.body.classList.toggle("paper"); save(); showPage(); }
      else if (c === "STEADY") { document.body.classList.toggle("steady"); save(); showPage(); }
      else if (c === "FIELD") { document.body.classList.toggle("field"); save(); showPage(); }
      else if (c === "INDEX" || c === "LS") index();
      else if (c === "HELP" || c === "?") help();
      else display.insertAdjacentHTML("beforeend",
        '<p class="err">UNRECOGNISED: ' + esc(c) + ' — TRY HELP</p>');
    }

    /* boot sequence */
    function boot() {
      let i = 0;
      display.innerHTML = "";
      const tick = () => {
        if (i < BOOT_LINES.length) {
          display.insertAdjacentHTML("beforeend",
            '<p class="sys">' + esc(BOOT_LINES[i] || " ") + "</p>");
          display.scrollTop = display.scrollHeight;
          i++;
          setTimeout(tick, BOOT_LINES[i - 1] === "" ? 120 : 240);
        } else {
          setTimeout(showPage, 500);
        }
      };
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced || state.booted) { showPage(); }
      else { tick(); state.booted = true; }
    }

    /* wiring */
    cmd.addEventListener("keydown", e => {
      if (e.key === "Enter") { run(cmd.value); cmd.value = ""; }
    });
    document.getElementById("cmdline").addEventListener("click", () => cmd.focus());
    document.querySelectorAll(".key").forEach(k =>
      k.addEventListener("click", () => run(k.dataset.cmd)));
    document.addEventListener("keydown", e => {
      if (document.activeElement === cmd && cmd.value) return;
      if (e.key === "ArrowRight") run("NEXT");
      if (e.key === "ArrowLeft") run("BACK");
    });
    let touchX = null;
    display.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive: true});
    display.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 60) run(dx < 0 ? "NEXT" : "BACK");
      touchX = null;
    }, {passive: true});

    boot();
  </script>
</body>
</html>
