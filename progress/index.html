<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Their Most August Public Organ — Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Georgia, 'Times New Roman', serif;
            color: #ccc;
            overflow: hidden;
        }

        h1 {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: #888;
        }

        .book-container {
            position: relative;
            perspective: 2500px;
        }

        .book {
            position: relative;
            transform-style: preserve-3d;
        }

        /* Desktop: double spread */
        .book.mode-spread {
            width: 1140px;
            height: 920px;
        }

        /* Mobile: single page */
        .book.mode-single {
            width: 570px;
            height: 920px;
        }

        /* Base spread (revealed by the flip) */
        .spread-base {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
        }

        .mode-spread .spread-base {
            width: 1140px;
            height: 920px;
        }

        .mode-single .spread-base {
            width: 570px;
            height: 920px;
        }

        /* The flipping page layer */
        .flip-layer {
            position: absolute;
            top: 0;
            right: 0;
            width: 570px;
            height: 920px;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000);
            z-index: 20;
        }

        .flip-layer.flipping-forward {
            transform: rotateY(-180deg);
        }

        /* Front face of flipping page */
        .flip-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 570px;
            height: 920px;
            backface-visibility: hidden;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 20px 0 30px -15px rgba(0,0,0,0.08);
        }

        /* Back face of flipping page */
        .flip-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 570px;
            height: 920px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #d4cfc6;
            box-shadow: inset -20px 0 30px -15px rgba(0,0,0,0.08);
        }

        .page {
            width: 570px;
            height: 920px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .page img, .flip-front img, .flip-back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Spine shadow */
        .page.left-page {
            border-right: 1px solid #d4cfc6;
            box-shadow: inset -20px 0 30px -15px rgba(0,0,0,0.08);
        }

        .page.right-page {
            box-shadow: inset 20px 0 30px -15px rgba(0,0,0,0.08);
        }

        /* Shadow during flip */
        .flip-shadow {
            position: absolute;
            top: 0;
            right: 0;
            width: 570px;
            height: 920px;
            background: rgba(0,0,0,0);
            transition: background 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000);
            z-index: 15;
            pointer-events: none;
        }

        .flip-shadow.active {
            background: rgba(0,0,0,0.08);
        }

        /* Book shadow */
        .book-shadow {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            height: 40px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
            z-index: -1;
        }

        .mode-spread .book-shadow { width: 1100px; }
        .mode-single .book-shadow { width: 530px; }

        /* Static spread */
        .spread-static {
            display: flex;
            box-shadow: 0 10px 60px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
        }

        .mode-spread .spread-static {
            width: 1140px;
            height: 920px;
        }

        .mode-single .spread-static {
            width: 570px;
            height: 920px;
        }

        /* Navigation */
        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-top: 1.5rem;
        }

        .nav button {
            background: none;
            border: 1px solid #444;
            color: #999;
            padding: 0.5rem 1.2rem;
            font-family: Georgia, serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }

        .nav button:hover:not(:disabled) {
            border-color: #888;
            color: #ddd;
        }

        .nav button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .page-indicator {
            font-size: 0.8rem;
            color: #666;
            min-width: 80px;
            text-align: center;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.05em;
            transition: opacity 0.5s;
        }

        /* Click zones */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .click-zone.left { left: 0; }
        .click-zone.right { right: 0; }

        .back-link {
            position: absolute;
            top: 1.2rem;
            left: 1.5rem;
            font-family: Georgia, serif;
            font-size: 0.8rem;
            color: #666;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ccc;
        }

        /* Desktop scaling */
        @media (max-width: 1200px) and (min-width: 769px) {
            .book.mode-spread { transform: scale(0.65); transform-origin: top center; }
            body { justify-content: flex-start; padding-top: 2rem; }
        }

        @media (max-width: 900px) and (min-width: 769px) {
            .book.mode-spread { transform: scale(0.45); transform-origin: top center; }
        }

        /* Mobile: scale single page to fit viewport */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start;
                padding-top: 3.5rem;
                overflow-y: auto;
            }

            h1 {
                font-size: 0.75rem;
                margin-bottom: 1rem;
            }

            .book.mode-single {
                /* Scale page to fit screen width with some padding */
                transform: scale(var(--mobile-scale, 0.5));
                transform-origin: top center;
            }

            .nav {
                margin-top: 0.8rem;
                gap: 1rem;
            }

            .nav button {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }

            .hint {
                font-size: 0.7rem;
            }

            .back-link {
                top: 0.8rem;
                left: 1rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Writing Log</a>
    <h1>Their Most August Public Organ</h1>

    <div class="book-container">
        <div id="book" class="book">
            <div class="book-shadow"></div>
        </div>
    </div>

    <div class="nav">
        <button id="prev" onclick="turnPage(-1)">&larr; Back</button>
        <span id="pageIndicator" class="page-indicator"></span>
        <button id="next" onclick="turnPage(1)">Turn &rarr;</button>
    </div>

    <div class="hint" id="hint">Click the page or use arrow keys</div>

    <script>
        const pages = [
            'pages/Page%201.png',
            'pages/Page%202.png',
            'pages/Page%203.png',
            'pages/Page%204.png',
            'pages/Page%205.png',
            'pages/Page%206.png',
            'pages/Page%207.png',
            'pages/Page%208.png',
            'pages/Page%209.png',
            'pages/Page%2010.png',
            'pages/Page%2011.png',
            'pages/Page%2012.png',
            'pages/Page%2013.png',
            'pages/Page%2014.png',
            'pages/Page%2015.png',
            'pages/Page%2016.png',
            'pages/Page%2017.png',
            'pages/Page%2018.png',
            'pages/Page%2019.png',
            'pages/Page%2020.png',
            'pages/Page%2021.png',
            'pages/Page%2022.png',
            'pages/Page%2023.png',
            'pages/Page%2024.png',
            'pages/Page%2025.png',
            'pages/Page%2026.png',
            'pages/Page%2027.png',
            'pages/Page%2028.png',
            'pages/Page%2029.png',
            'pages/Page%2030.png',
            'pages/Page%2031.png',
            'pages/Page%2032.png',
            'pages/Page%2033.png',
            'pages/Page%2034.png',
            'pages/Page%2035.png',
            'pages/Page%2036.png',
            'pages/Page%2037.png',
            'pages/Page%2038.png',
            'pages/Page%2039.png',
            'pages/Page%2040.png',
            'pages/Page%2041.png',
            'pages/Page%2042.png',
            'pages/Page%2043.png',
            'pages/Page%2044.png',
            'pages/Page%2045.png',
            'pages/Page%2046.png',
            'pages/Page%2047.png',
            'pages/Page%2048.png',
        ];

        const MOBILE_BREAKPOINT = 768;
        let isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
        let currentIndex = 0; // unified index into views array
        let views = [];       // each view is [left, right] for spread or [page] for single
        let isAnimating = false;

        const book = document.getElementById('book');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const indicator = document.getElementById('pageIndicator');
        const hint = document.getElementById('hint');

        function buildViews() {
            views = [];
            if (isMobile) {
                // Single page mode: one page per view
                pages.forEach(p => views.push([p]));
            } else {
                // Spread mode: [blank, page1], [page2, page3], ...
                views.push([null, pages[0]]);
                for (let i = 1; i < pages.length; i += 2) {
                    views.push([pages[i], pages[i + 1] || null]);
                }
            }
        }

        function setMobileScale() {
            if (isMobile) {
                const scale = (window.innerWidth - 32) / 570;
                document.documentElement.style.setProperty('--mobile-scale', Math.min(scale, 1));
            }
        }

        function makePage(src, extraClass) {
            const div = document.createElement('div');
            div.className = 'page ' + (extraClass || '');
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'Page';
                img.draggable = false;
                div.appendChild(img);
            }
            return div;
        }

        function makeImg(src) {
            if (!src) return null;
            const img = document.createElement('img');
            img.src = src;
            img.alt = 'Page';
            img.draggable = false;
            return img;
        }

        function updateControls(index) {
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === views.length - 1;

            if (isMobile) {
                indicator.textContent = `Page ${index + 1} of ${pages.length}`;
            } else {
                if (index === 0) {
                    indicator.textContent = 'Page 1';
                } else {
                    const leftNum = index * 2;
                    const rightNum = leftNum + 1;
                    if (rightNum <= pages.length) {
                        indicator.textContent = `Pages ${leftNum}\u2013${rightNum}`;
                    } else {
                        indicator.textContent = `Page ${leftNum}`;
                    }
                }
            }

            if (index > 0) hint.style.opacity = '0';
        }

        function renderStatic(index) {
            const shadow = book.querySelector('.book-shadow');
            book.innerHTML = '';
            book.appendChild(shadow);

            const spread = document.createElement('div');
            spread.className = 'spread-static';

            const view = views[index];

            if (isMobile) {
                spread.appendChild(makePage(view[0], ''));
            } else {
                spread.appendChild(makePage(view[0], 'left-page'));
                spread.appendChild(makePage(view[1], 'right-page'));
            }

            // Click zones
            const leftZone = document.createElement('div');
            leftZone.className = 'click-zone left';
            leftZone.onclick = () => turnPage(-1);
            spread.appendChild(leftZone);

            const rightZone = document.createElement('div');
            rightZone.className = 'click-zone right';
            rightZone.onclick = () => turnPage(1);
            spread.appendChild(rightZone);

            book.appendChild(spread);
            updateControls(index);
        }

        // --- SPREAD MODE FLIP ---

        function flipForwardSpread() {
            const nextIdx = currentIndex + 1;
            if (nextIdx >= views.length || isAnimating) return;
            isAnimating = true;

            const shadow = book.querySelector('.book-shadow');
            book.innerHTML = '';
            book.appendChild(shadow);

            const [curLeft, curRight] = views[currentIndex];
            const [nextLeft, nextRight] = views[nextIdx];

            const base = document.createElement('div');
            base.className = 'spread-base';
            base.appendChild(makePage(curLeft, 'left-page'));
            base.appendChild(makePage(nextRight, 'right-page'));
            book.appendChild(base);

            const flipShadow = document.createElement('div');
            flipShadow.className = 'flip-shadow';
            book.appendChild(flipShadow);

            const flipLayer = document.createElement('div');
            flipLayer.className = 'flip-layer';

            const front = document.createElement('div');
            front.className = 'flip-front';
            const frontImg = makeImg(curRight);
            if (frontImg) front.appendChild(frontImg);
            flipLayer.appendChild(front);

            const back = document.createElement('div');
            back.className = 'flip-back';
            const backImg = makeImg(nextLeft);
            if (backImg) back.appendChild(backImg);
            flipLayer.appendChild(back);

            book.appendChild(flipLayer);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flipLayer.classList.add('flipping-forward');
                    flipShadow.classList.add('active');
                });
            });

            flipLayer.addEventListener('transitionend', () => {
                currentIndex = nextIdx;
                isAnimating = false;
                renderStatic(currentIndex);
            }, { once: true });

            updateControls(nextIdx);
        }

        function flipBackSpread() {
            const prevIdx = currentIndex - 1;
            if (prevIdx < 0 || isAnimating) return;
            isAnimating = true;

            const shadow = book.querySelector('.book-shadow');
            book.innerHTML = '';
            book.appendChild(shadow);

            const [curLeft, curRight] = views[currentIndex];
            const [prevLeft, prevRight] = views[prevIdx];

            const base = document.createElement('div');
            base.className = 'spread-base';
            base.appendChild(makePage(prevLeft, 'left-page'));
            base.appendChild(makePage(curRight, 'right-page'));
            book.appendChild(base);

            const flipShadow = document.createElement('div');
            flipShadow.className = 'flip-shadow';
            flipShadow.classList.add('active');
            book.appendChild(flipShadow);

            const flipLayer = document.createElement('div');
            flipLayer.className = 'flip-layer';
            flipLayer.style.transform = 'rotateY(-180deg)';

            const front = document.createElement('div');
            front.className = 'flip-front';
            const frontImg = makeImg(prevRight);
            if (frontImg) front.appendChild(frontImg);
            flipLayer.appendChild(front);

            const back = document.createElement('div');
            back.className = 'flip-back';
            const backImg = makeImg(curLeft);
            if (backImg) back.appendChild(backImg);
            flipLayer.appendChild(back);

            book.appendChild(flipLayer);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flipLayer.style.transform = 'rotateY(0deg)';
                    flipShadow.classList.remove('active');
                });
            });

            flipLayer.addEventListener('transitionend', () => {
                currentIndex = prevIdx;
                isAnimating = false;
                renderStatic(currentIndex);
            }, { once: true });

            updateControls(prevIdx);
        }

        // --- SINGLE PAGE MODE FLIP ---

        function flipForwardSingle() {
            const nextIdx = currentIndex + 1;
            if (nextIdx >= views.length || isAnimating) return;
            isAnimating = true;

            const shadow = book.querySelector('.book-shadow');
            book.innerHTML = '';
            book.appendChild(shadow);

            // Base: next page underneath
            const base = document.createElement('div');
            base.className = 'spread-base';
            base.appendChild(makePage(views[nextIdx][0], ''));
            book.appendChild(base);

            // Flip layer: front = current page, back = blank (page back)
            const flipLayer = document.createElement('div');
            flipLayer.className = 'flip-layer';
            flipLayer.style.right = '0';
            flipLayer.style.width = '570px';
            flipLayer.style.transformOrigin = 'left center';

            const front = document.createElement('div');
            front.className = 'flip-front';
            const frontImg = makeImg(views[currentIndex][0]);
            if (frontImg) front.appendChild(frontImg);
            flipLayer.appendChild(front);

            const back = document.createElement('div');
            back.className = 'flip-back';
            back.style.background = '#ffffff';
            flipLayer.appendChild(back);

            book.appendChild(flipLayer);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flipLayer.classList.add('flipping-forward');
                });
            });

            flipLayer.addEventListener('transitionend', () => {
                currentIndex = nextIdx;
                isAnimating = false;
                renderStatic(currentIndex);
            }, { once: true });

            updateControls(nextIdx);
        }

        function flipBackSingle() {
            const prevIdx = currentIndex - 1;
            if (prevIdx < 0 || isAnimating) return;
            isAnimating = true;

            const shadow = book.querySelector('.book-shadow');
            book.innerHTML = '';
            book.appendChild(shadow);

            // Base: current page underneath
            const base = document.createElement('div');
            base.className = 'spread-base';
            base.appendChild(makePage(views[currentIndex][0], ''));
            book.appendChild(base);

            // Flip layer starts flipped, reveals previous page
            const flipLayer = document.createElement('div');
            flipLayer.className = 'flip-layer';
            flipLayer.style.right = '0';
            flipLayer.style.width = '570px';
            flipLayer.style.transformOrigin = 'left center';
            flipLayer.style.transform = 'rotateY(-180deg)';

            const front = document.createElement('div');
            front.className = 'flip-front';
            const frontImg = makeImg(views[prevIdx][0]);
            if (frontImg) front.appendChild(frontImg);
            flipLayer.appendChild(front);

            const back = document.createElement('div');
            back.className = 'flip-back';
            back.style.background = '#ffffff';
            flipLayer.appendChild(back);

            book.appendChild(flipLayer);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flipLayer.style.transform = 'rotateY(0deg)';
                });
            });

            flipLayer.addEventListener('transitionend', () => {
                currentIndex = prevIdx;
                isAnimating = false;
                renderStatic(currentIndex);
            }, { once: true });

            updateControls(prevIdx);
        }

        // --- UNIFIED TURN ---

        function turnPage(dir) {
            if (isMobile) {
                if (dir > 0) flipForwardSingle();
                else flipBackSingle();
            } else {
                if (dir > 0) flipForwardSpread();
                else flipBackSpread();
            }
        }

        // --- SWIPE SUPPORT ---

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;
            // Only trigger if horizontal swipe is dominant and > 50px
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                if (dx < 0) turnPage(1);  // swipe left = next
                else turnPage(-1);        // swipe right = prev
            }
        }, { passive: true });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                turnPage(1);
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                turnPage(-1);
            }
        });

        // --- RESPONSIVE MODE SWITCHING ---

        let firstInit = true;

        // Optional deep link: /progress/?page=N (1-based). Returns 0-based index or null.
        function getDeepLinkPageIndex() {
            const param = new URLSearchParams(window.location.search).get('page');
            if (!param) return null;
            const n = parseInt(param, 10);
            if (!Number.isFinite(n) || n < 1) return null;
            return Math.min(n - 1, pages.length - 1);
        }

        function init() {
            const wasMobile = isMobile;
            isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
            book.className = 'book ' + (isMobile ? 'mode-single' : 'mode-spread');
            setMobileScale();

            // On first load, honour a ?page= deep link; otherwise preserve position
            const deepLink = firstInit ? getDeepLinkPageIndex() : null;
            const oldPageIndex = deepLink !== null ? deepLink : getApproxPageIndex();
            firstInit = false;
            buildViews();
            currentIndex = findViewForPage(oldPageIndex);
            renderStatic(currentIndex);
        }

        // Approximate which page number the user is looking at
        function getApproxPageIndex() {
            if (views.length === 0) return 0;
            if (isMobile) return currentIndex;
            // In spread mode, estimate from spread index
            if (currentIndex === 0) return 0;
            return currentIndex * 2 - 1;
        }

        function findViewForPage(pageIdx) {
            if (isMobile) return Math.min(pageIdx, views.length - 1);
            // In spread mode, find which spread contains this page
            if (pageIdx === 0) return 0;
            return Math.min(Math.ceil(pageIdx / 2), views.length - 1);
        }

        window.addEventListener('resize', () => {
            const nowMobile = window.innerWidth <= MOBILE_BREAKPOINT;
            if (nowMobile !== isMobile) {
                init();
            } else if (isMobile) {
                setMobileScale();
            }
        });

        // Preload
        pages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        // Update hint for mobile
        if (isMobile) {
            hint.textContent = 'Swipe or tap to turn pages';
        }

        init();
    </script>
</body>
</html>
